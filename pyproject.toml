[project]
name = "dbt-ggsql"
version = "0.1.0"
description = "Community extension: run ggsql visualizations as part of your dbt pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
    "click>=8.0",
    "dbt-duckdb>=1.9",
]

[project.scripts]
dbt-ggsql = "dbt_ggsql.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
